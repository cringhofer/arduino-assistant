[package]
name = "uno-assistant"
version = "0.1.0"
edition = "2024"
description = "Offline voice assistant (wake word 'computer') for the Arduino UNO Q"

[features]
default = ["llm", "moonshine"]
# Fallback to a local llama.cpp server for questions the built-in skills don't cover.
llm = ["dep:ureq"]
# Moonshine speech-to-text via the official moonshine-voice library (English and German),
# loaded at run time: no build-time dependency.
moonshine = ["dep:libloading"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
env_logger = "0.11.11"
libloading = { version = "0.8", optional = true }
log = "0.4.34"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"
# localhost only, so no TLS stack needed
ureq = { version = "3.5.0", default-features = false, features = ["json"], optional = true }
vosk = "0.3.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
